name: Keep-alive ping

# Pings the backend's /health endpoint every 10 minutes. This does double
# duty against two separate free-tier inactivity risks:
#   1. Supabase pauses the database after a stretch of inactivity (measured
#      in days) - a periodic hit keeps the project counted as active.
#   2. Render spins a free-tier web service down after ~15 minutes of
#      inactivity - a much more aggressive threshold, which is why this runs
#      every 10 minutes rather than the old every-3-days schedule (that
#      cadence only ever addressed the Supabase side of this).
#
# The response is checked explicitly for HTTP 200, not just "did curl not
# crash" - a broken deploy (or a 4xx/5xx/redirect from the health endpoint)
# fails this job outright, so it shows up as a red X in the Actions tab
# instead of a silently-green checkmark that isn't actually confirming
# anything.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allows a manual "Run workflow" click for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://api.bssupport.care/health)
          echo "Health check responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Health check failed - expected HTTP 200, got $status"
            exit 1
          fi
